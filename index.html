<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>心盘 · 起心动念，借卦观心</title>
<style>
  :root{
    --bg:#ffffff; --panel:#fafafa; --panel-2:#f4f4f5;
    --border:#e4e4e7; --border-strong:#d4d4d8;
    --text:#18181b; --muted:#71717a; --faint:#a1a1aa;
    --accent:#4F46E5; --accent-press:#4338CA;
    --accent-soft:#EEF2FF; --accent-border:#C7D2FE;
    --yang:#18181b; --yin:#71717a;
    --radius:10px;
    --mono: ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--sans);
    background:var(--bg);
    color:var(--text);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  .wrap{max-width:720px;margin:0 auto;padding:48px 24px 80px;}
  header.top{text-align:center;margin-bottom:40px;}
  header.top .mark{
    font-family:var(--mono);letter-spacing:.42em;font-size:12px;
    color:var(--accent);text-transform:uppercase;margin-bottom:14px;
  }
  header.top h1{font-size:30px;font-weight:600;margin:0 0 8px;letter-spacing:.04em;}
  header.top p{color:var(--muted);font-size:14px;margin:0;}

  .screen{display:none;animation:fade .5s ease both;}
  .screen.active{display:block;}
  @keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

  .step-hint{display:flex;align-items:center;gap:10px;color:var(--faint);font-size:12px;margin-bottom:18px;font-family:var(--mono);}
  .step-hint .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);}

  .group{margin-bottom:28px;}
  .group > label{display:block;font-size:13px;color:var(--muted);margin-bottom:12px;letter-spacing:.02em;}

  .chips{display:flex;flex-wrap:wrap;gap:10px;}
  .chip{
    border:1px solid var(--border);background:var(--panel);
    padding:10px 18px;border-radius:999px;font-size:14px;cursor:pointer;
    transition:all .18s ease;user-select:none;color:var(--text);
  }
  .chip:hover{border-color:var(--border-strong);}
  .chip.sel{background:var(--accent-soft);border-color:var(--accent-border);color:var(--accent-press);font-weight:500;}

  textarea,input[type=number]{
    width:100%;border:1px solid var(--border);border-radius:var(--radius);
    background:var(--panel);padding:12px 14px;font-family:var(--sans);font-size:14px;
    color:var(--text);resize:vertical;transition:border-color .18s ease;
  }
  textarea:focus,input:focus{outline:none;border-color:var(--accent);}
  textarea::placeholder{color:var(--faint);}

  .numrow{display:flex;gap:14px;}
  .numrow > div{flex:1;}
  .numrow label{display:block;font-size:12px;color:var(--muted);margin-bottom:8px;}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    border:1px solid var(--accent);background:var(--accent);color:#fff;
    padding:13px 26px;border-radius:var(--radius);font-size:15px;font-weight:500;
    cursor:pointer;transition:all .18s ease;font-family:var(--sans);
  }
  .btn:hover{background:var(--accent-press);border-color:var(--accent-press);}
  .btn.ghost{background:transparent;color:var(--accent);border-color:var(--accent-border);}
  .btn.ghost:hover{background:var(--accent-soft);}
  .btn.big{width:100%;padding:18px;font-size:16px;letter-spacing:.12em;}

  .breath{
    width:160px;height:160px;border-radius:50%;
    border:1px solid var(--accent-border);background:var(--accent-soft);
    margin:0 auto 30px;display:flex;align-items:center;justify-content:center;
    color:var(--accent-press);font-family:var(--mono);font-size:14px;letter-spacing:.2em;
    animation:breathe 4.2s ease-in-out infinite;
  }
  @keyframes breathe{
    0%,100%{transform:scale(.92);opacity:.7;}
    50%{transform:scale(1.06);opacity:1;}
  }
  .center{text-align:center;}

  /* result */
  .verdict{
    border:1px solid var(--accent-border);background:var(--accent-soft);
    border-radius:var(--radius);padding:18px 20px;margin-bottom:24px;
  }
  .verdict .tag{font-family:var(--mono);font-size:12px;letter-spacing:.18em;color:var(--accent-press);}
  .verdict .txt{font-size:15px;margin-top:6px;color:var(--text);}

  .three{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:28px;}
  .hexcard{
    border:1px solid var(--border);border-radius:var(--radius);
    padding:18px 12px;text-align:center;background:var(--panel);
  }
  .hexcard.accent{border-color:var(--accent-border);background:var(--accent-soft);}
  .hexcard .role{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--muted);margin-bottom:12px;}
  .hexcard .hexname{font-size:17px;font-weight:600;margin-top:12px;}
  .hexcard .sym{font-family:var(--mono);color:var(--accent);font-size:13px;margin-top:4px;}
  .hexcard .lines{margin-top:10px;display:inline-block;}

  .trig,.hex{display:flex;flex-direction:column;gap:5px;align-items:center;}
  .hex{gap:4px;}
  .bar{height:5px;border-radius:3px;background:var(--yang);}
  .bar.yang{width:46px;}
  .bar.yin{width:46px;display:flex;justify-content:space-between;background:transparent;}
  .bar.yin span{width:42%;height:5px;border-radius:3px;background:var(--yin);}

  .block{border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:18px;background:var(--bg);}
  .block h3{font-size:14px;margin:0 0 12px;font-weight:600;display:flex;align-items:center;gap:8px;}
  .block h3 .num{font-family:var(--mono);color:var(--accent);font-size:12px;}
  .block .body{font-size:14.5px;color:var(--text);}
  .block .sub{font-size:13px;color:var(--muted);margin-top:8px;}
  .tuan{font-family:"Songti SC","STSong",serif;font-size:15px;color:#3f3f46;letter-spacing:.02em;}

  .params{font-family:var(--mono);font-size:12px;color:var(--muted);background:var(--panel-2);border-radius:8px;padding:10px 14px;display:inline-block;}

  /* 灵签 */
  .sign-hero{
    border:1px solid var(--accent-border);background:var(--accent-soft);
    border-radius:var(--radius);padding:24px 20px;margin-bottom:22px;text-align:center;
  }
  .sign-hero .grade{font-family:var(--mono);font-size:12px;letter-spacing:.24em;color:var(--accent-press);}
  .sign-hero .no{font-size:13px;color:var(--muted);margin-top:6px;}
  .sign-hero .title{font-family:"Songti SC","STSong",serif;font-size:24px;font-weight:600;margin:10px 0 4px;letter-spacing:.12em;}
  .sign-poem{
    font-family:"Songti SC","STSong",serif;font-size:17px;line-height:2.1;
    color:#3f3f46;text-align:center;letter-spacing:.06em;
    border-left:3px solid var(--accent-border);padding:6px 0;margin:4px 0;
  }
  .read-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px;}
  .read-item{border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;background:var(--panel);}
  .read-item .k{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--accent);margin-bottom:6px;}
  .read-item .v{font-size:13.5px;color:var(--text);line-height:1.6;}
  @media(max-width:480px){ .read-grid{grid-template-columns:1fr;} }

  /* 断事落地 / 卦象结构 / 卦簿 */
  .clue-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px;}
  .clue{border:1px solid var(--border);border-radius:8px;padding:12px 14px;background:var(--panel);}
  .clue .k{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--accent);margin-bottom:5px;}
  .clue .v{font-size:13px;color:var(--text);line-height:1.6;}
  .mini-h{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--faint);margin:14px 0 8px;}
  .tag-pill{display:inline-block;font-family:var(--mono);font-size:11px;padding:2px 9px;border-radius:999px;border:1px solid var(--border);color:var(--muted);margin-right:6px;}
  .tag-pill.on{border-color:var(--accent-border);background:var(--accent-soft);color:var(--accent-press);}
  .struct-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;}
  .struct-chip{flex:1;min-width:150px;border:1px solid var(--border);border-radius:8px;padding:12px 14px;background:var(--panel);}
  .struct-chip .k{font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:6px;}
  .struct-chip .v{font-size:14px;font-weight:500;}
  .struct-chip .d{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.5;}
  .book-bar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;}
  .book-stat{font-family:var(--mono);font-size:12px;color:var(--muted);}
  .book-stat b{color:var(--accent-press);font-weight:500;}
  .rec{border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;margin-bottom:12px;background:var(--panel);}
  .rec-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap;}
  .rec-q{font-size:14.5px;color:var(--text);font-weight:500;flex:1;min-width:180px;}
  .rec-meta{font-family:var(--mono);font-size:11px;color:var(--faint);}
  .rec-gua{font-size:12.5px;color:var(--muted);margin-top:6px;}
  .rec-act{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
  .mini-btn{border:1px solid var(--border);background:#fff;border-radius:8px;padding:6px 12px;font-size:12.5px;color:var(--text);cursor:pointer;transition:all .18s ease;font-family:var(--sans);}
  .mini-btn:hover{border-color:var(--accent-border);}
  .mini-btn.hit{border-color:var(--accent-border);background:var(--accent-soft);color:var(--accent-press);}
  .mini-btn.miss{border-color:#fecaca;background:#fef2f2;color:#b91c1c;}
  .rec-note{width:100%;margin-top:10px;font-size:13px;}
  .empty{text-align:center;color:var(--faint);font-size:13px;padding:40px 0;}
  @media(max-width:480px){ .clue-grid{grid-template-columns:1fr;} }
  .disclaim{
    margin-top:36px;padding-top:20px;border-top:1px solid var(--border);
    font-size:12px;color:var(--faint);line-height:1.7;text-align:center;
  }
  .actions{display:flex;gap:12px;margin-top:30px;}
  .actions .btn{flex:1;}
  .note{font-size:12px;color:var(--faint);margin-top:10px;}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="mark">XIN · PAN</div>
    <h1>心盘</h1>
    <p>起心动念，借卦观心 · 一枚数字心镜</p>
    <div style="margin-top:16px;"><button class="mini-btn" id="openBook">打开卦簿 · 复盘应验</button></div>
  </header>

  <!-- Step 1: 静心起念 -->
  <section id="s1" class="screen active">
    <div class="step-hint"><span class="dot"></span>第一步 · 静心起念</div>

    <div class="group">
      <label>你心里挂念的是哪一类事？（选定后，解读会据此落点）</label>
      <div class="chips" id="catChips">
        <div class="chip" data-cat="感情">感情</div>
        <div class="chip" data-cat="事业">事业</div>
        <div class="chip" data-cat="财运">财运</div>
        <div class="chip" data-cat="决策">决策 / 选择</div>
      </div>
    </div>

    <div class="group">
      <label>把问题在心里默念清楚（可写下来，也可只放在心里）</label>
      <textarea id="qtext" rows="2" placeholder="例：这段关系接下来会如何发展？ / 这个机会该不该接？"></textarea>
    </div>

    <div class="group">
      <label>起卦方式</label>
      <div class="chips" id="modeChips">
        <div class="chip sel" data-mode="time">起心动念 · 时辰（取当下刹那）</div>
        <div class="chip" data-mode="num">报数（心里想两个数字）</div>
        <div class="chip" data-mode="draw">灵签（默念后求签）</div>
      </div>
      <div id="numInputs" class="numrow" style="display:none;margin-top:14px;">
        <div><label>第一个数</label><input type="number" id="numA" placeholder="如 7" /></div>
        <div><label>第二个数</label><input type="number" id="numB" placeholder="如 23" /></div>
      </div>
    </div>

    <button class="btn big" id="toCast">心已静，去起盘 →</button>
  </section>

  <!-- Step 2: 起盘 -->
  <section id="s2" class="screen">
    <div class="step-hint"><span class="dot"></span>第二步 · 起心动念 · 起盘</div>
    <div class="center">
      <div class="breath" id="breath">观 心</div>
      <p id="castPrompt" style="color:var(--muted);font-size:14px;margin:0 0 26px;">在念头最清晰的刹那落下——</p>
      <button class="btn big" id="castBtn" style="max-width:320px;margin:0 auto;">起 盘</button>
      <p class="note" id="castNote"></p>
    </div>
    <div class="actions">
      <button class="btn ghost" id="back1">← 重新想想</button>
    </div>
  </section>

  <!-- 卦簿：验证闭环 -->
  <section id="s4" class="screen">
    <div class="step-hint"><span class="dot"></span>卦簿 · 起卦留档与复盘</div>
    <div id="bookList"></div>
    <div class="actions">
      <button class="btn ghost" id="bookBack">← 返回起卦</button>
    </div>
    <div class="disclaim">
      卦簿只存在这台设备的浏览器里，不上传、不联网。清理浏览器数据会一并清除——重要复盘请自行截图留存。
    </div>
  </section>

  <!-- Step 3: 结果 -->
  <section id="s3" class="screen">
    <div class="step-hint"><span class="dot"></span>第三步 · 借卦观心</div>
    <div id="result"></div>
    <div class="actions">
      <button class="btn ghost" id="back2">← 再起一卦</button>
      <button class="btn" id="restart">重新来过</button>
    </div>
    <div class="disclaim">
      心盘是一枚「借卦观心」的自省工具。卦象只是镜子，照见的是你此刻的心与势，并非定数。<br/>
      结果仅供启迪与娱乐，不构成任何专业（命理、法律、医疗、投资）建议。命运自在人心。
    </div>
  </section>
</div>

<script>
/* ============ 基础数据 ============ */
const TRIGRAMS = {
  1:{name:'乾',sym:'☰',wu:'金',nature:'天',binary:[1,1,1]},
  2:{name:'兑',sym:'☱',wu:'金',nature:'泽',binary:[1,1,0]},
  3:{name:'离',sym:'☲',wu:'火',nature:'火',binary:[1,0,1]},
  4:{name:'震',sym:'☳',wu:'木',nature:'雷',binary:[1,0,0]},
  5:{name:'巽',sym:'☴',wu:'木',nature:'风',binary:[0,1,1]},
  6:{name:'坎',sym:'☵',wu:'水',nature:'水',binary:[0,1,0]},
  7:{name:'艮',sym:'☶',wu:'土',nature:'山',binary:[0,0,1]},
  8:{name:'坤',sym:'☷',wu:'土',nature:'地',binary:[0,0,0]},
};
const BRANCH = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];

const HEX = [
 {n:1,name:'乾',U:1,D:1,tuan:'元，亨，利，贞。',xiang:'刚健中正，自强不息，纯阳开端之象。'},
 {n:2,name:'坤',U:8,D:8,tuan:'元亨，利牝马之贞。君子有攸往，先迷后得主，利。',xiang:'厚德载物，柔顺包容，承载守成之象。'},
 {n:3,name:'屯',U:6,D:4,tuan:'元亨，利贞。勿用有攸往，利建侯。',xiang:'万物始生，艰难起步，宜固本扎根、求贤辅助。'},
 {n:4,name:'蒙',U:7,D:6,tuan:'亨。匪我求童蒙，童蒙求我。初筮告，再三渎，渎则不告。利贞。',xiang:'蒙昧待启，启蒙养正，宜虚心受教。'},
 {n:5,name:'需',U:6,D:1,tuan:'有孚，光亨，贞吉。利涉大川。',xiang:'待时而动，守正待机则通。'},
 {n:6,name:'讼',U:1,D:6,tuan:'有孚，窒。惕中吉。终凶。利见大人，不利涉大川。',xiang:'争讼之象，慎防口舌，宜退让中和。'},
 {n:7,name:'师',U:8,D:6,tuan:'贞，丈人吉，无咎。',xiang:'兵众之象，用师以正，倚重长者统率。'},
 {n:8,name:'比',U:6,D:8,tuan:'吉。原筮，元永贞，无咎。不宁方来，后夫凶。',xiang:'亲比辅佐，择善而附，人和则吉。'},
 {n:9,name:'小畜',U:5,D:1,tuan:'亨。密云不雨，自我西郊。',xiang:'小有蓄积，阴畜其阳，宜积小成待发。'},
 {n:10,name:'履',U:1,D:2,tuan:'履虎尾，不咥人，亨。',xiang:'履险如夷，谨慎前行，礼以行之则亨。'},
 {n:11,name:'泰',U:8,D:1,tuan:'小往大来，吉亨。',xiang:'天地交泰，阴阳和合，通达兴盛之时。'},
 {n:12,name:'否',U:1,D:8,tuan:'否之匪人，不利君子贞，大往小来。',xiang:'天地不交，闭塞不通，宜韬光养晦。'},
 {n:13,name:'同人',U:1,D:3,tuan:'同人于野，亨。利涉大川，利君子贞。',xiang:'与人和同，协和共进，利涉险阻。'},
 {n:14,name:'大有',U:3,D:1,tuan:'元亨。',xiang:'富有日新，大而能谦，盛德之象。'},
 {n:15,name:'谦',U:8,D:7,tuan:'亨，君子有终。',xiang:'谦尊而光，卑而不可逾，君子有终。'},
 {n:16,name:'豫',U:4,D:8,tuan:'利建侯行师。',xiang:'欢乐顺动，未雨绸缪，宜建侯行师。'},
 {n:17,name:'随',U:2,D:4,tuan:'元亨利贞，无咎。',xiang:'随时而动，从善随顺，元亨利贞。'},
 {n:18,name:'蛊',U:7,D:5,tuan:'元亨，利涉大川。先甲三日，后甲三日。',xiang:'积弊待治，拨乱反正，宜革故鼎新。'},
 {n:19,name:'临',U:8,D:2,tuan:'元，亨，利，贞。至于八月有凶。',xiang:'临下亲民，阳气渐长，居安思危。'},
 {n:20,name:'观',U:5,D:8,tuan:'盥而不荐，有孚颙若。',xiang:'观风察俗，省方观民，洁诚自守。'},
 {n:21,name:'噬嗑',U:3,D:4,tuan:'亨。利用狱。',xiang:'咬合去梗，明罚敕法，决而能通。'},
 {n:22,name:'贲',U:7,D:3,tuan:'亨。小利有攸往。',xiang:'文饰之美，质文相济，尚饰而不溺。'},
 {n:23,name:'剥',U:7,D:8,tuan:'不利有攸往。',xiang:'阴剥其阳，小人得势，宜止不宜进。'},
 {n:24,name:'复',U:8,D:4,tuan:'亨。出入无疾，朋来无咎。反复其道，七日来复，利有攸往。',xiang:'一阳来复，生机回归，反复其道而利往。'},
 {n:25,name:'无妄',U:1,D:4,tuan:'元，亨，利，贞。其匪正有眚，不利有攸往。',xiang:'至诚无妄，顺天休命，不妄动则吉。'},
 {n:26,name:'大畜',U:7,D:1,tuan:'利贞，不家食吉，利涉大川。',xiang:'厚积大畜，畜德养贤，利涉大川。'},
 {n:27,name:'颐',U:7,D:4,tuan:'贞吉。观颐，自求口实。',xiang:'颐养之道，慎言节食，自求口实。'},
 {n:28,name:'大过',U:2,D:5,tuan:'栋桡，利有攸往，亨。',xiang:'非常之时，栋桡将倾，独立不惧、遁世无闷。'},
 {n:29,name:'坎',U:6,D:6,tuan:'习坎，有孚，维心亨，行有尚。',xiang:'重重险陷，维心亨通，习坎有孚则出险。'},
 {n:30,name:'离',U:3,D:3,tuan:'利贞，亨。畜牝牛，吉。',xiang:'明丽附著，继明照四方，柔顺中正则吉。'},
 {n:31,name:'咸',U:2,D:7,tuan:'亨，利贞，取女吉。',xiang:'感应交合，少男少女，以虚受人则吉。'},
 {n:32,name:'恒',U:4,D:5,tuan:'亨，无咎，利贞，利有攸往。',xiang:'恒久不已，雷风相与，持之以恒则利。'},
 {n:33,name:'遁',U:1,D:7,tuan:'亨，小利贞。',xiang:'退避保身，与时偕行，小利贞。'},
 {n:34,name:'大壮',U:4,D:1,tuan:'利贞。',xiang:'阳刚壮盛，壮勿妄动，守正则利。'},
 {n:35,name:'晋',U:3,D:8,tuan:'康侯用锡马蕃庶，昼日三接。',xiang:'进长之象，明出地上，日进其明。'},
 {n:36,name:'明夷',U:8,D:3,tuan:'利艰贞。',xiang:'光明受伤，韬光养晦，利艰贞。'},
 {n:37,name:'家人',U:5,D:3,tuan:'利女贞。',xiang:'家道正齐，女主内正，风化之始。'},
 {n:38,name:'睽',U:3,D:2,tuan:'小事吉。',xiang:'乖离背反，同中求异，小事可成。'},
 {n:39,name:'蹇',U:6,D:7,tuan:'利西南，不利东北。利见大人，贞吉。',xiang:'蹇难在前，反身修德，利西南不利东北。'},
 {n:40,name:'解',U:4,D:6,tuan:'利西南，无所往，其来复吉。有攸往，夙吉。',xiang:'险难消解，舒缓和解，夙吉。'},
 {n:41,name:'损',U:7,D:2,tuan:'有孚，元吉，无咎，可贞，利有攸往。曷之用？二簋可用享。',xiang:'损下益上，损益有节，二簋可用享。'},
 {n:42,name:'益',U:5,D:4,tuan:'利有攸往，利涉大川。',xiang:'损上益下，与时偕行，利有攸往。'},
 {n:43,name:'夬',U:2,D:1,tuan:'扬于王庭，孚号有厉。告自邑，不利即戎，利有攸往。',xiang:'决去小人，刚决而和，扬于王庭而有厉。'},
 {n:44,name:'姤',U:1,D:5,tuan:'女壮，勿用取女。',xiang:'阴阳相遇，女壮勿取，防微杜渐。'},
 {n:45,name:'萃',U:2,D:8,tuan:'亨。王假有庙，利见大人，亨，利贞。用大牲吉，利有攸往。',xiang:'荟萃聚集，王假有庙，人和物聚。'},
 {n:46,name:'升',U:8,D:5,tuan:'元亨，用见大人，勿恤，南征吉。',xiang:'积小成高，地中生木，用见大人南征吉。'},
 {n:47,name:'困',U:2,D:6,tuan:'亨，贞，大人吉，无咎。有言不信。',xiang:'穷困之象，处困守正，有言不信。'},
 {n:48,name:'井',U:6,D:5,tuan:'改邑不改井，无丧无得，往来井井。汔至，亦未繘井，羸其瓶，凶。',xiang:'养而不穷，井养不穷，宜修德惠民。'},
 {n:49,name:'革',U:2,D:3,tuan:'巳日乃孚，元亨利贞，悔亡。',xiang:'除旧布新，巳日乃孚，顺天应人。'},
 {n:50,name:'鼎',U:3,D:5,tuan:'元吉，亨。',xiang:'鼎新取象，烹饪养贤，元吉亨通。'},
 {n:51,name:'震',U:4,D:4,tuan:'亨。震来虩虩，笑言哑哑。震惊百里，不丧匕鬯。',xiang:'震动惊惧，恐惧修省，不丧匕鬯。'},
 {n:52,name:'艮',U:7,D:7,tuan:'艮其背，不获其身，行其庭，不见其人，无咎。',xiang:'止其所止，时止则止，动静不失其时。'},
 {n:53,name:'渐',U:5,D:7,tuan:'女归吉，利贞。',xiang:'循序渐进，女归吉，循序渐进则利。'},
 {n:54,name:'归妹',U:4,D:2,tuan:'征凶，无攸利。',xiang:'婚嫁失正，行则凶，无攸利。'},
 {n:55,name:'丰',U:4,D:3,tuan:'亨，王假之，勿忧，宜日中。',xiang:'丰大光明，日中则昃，宜日中勿忧。'},
 {n:56,name:'旅',U:3,D:7,tuan:'小亨，旅贞吉。',xiang:'行旅飘寄，小亨旅贞，慎处逆境。'},
 {n:57,name:'巽',U:5,D:5,tuan:'小亨，利有攸往，利见大人。',xiang:'顺而入之，随风申命，小亨利往。'},
 {n:58,name:'兑',U:2,D:2,tuan:'亨，利贞。',xiang:'和悦说言，朋友讲习，亨利贞。'},
 {n:59,name:'涣',U:5,D:6,tuan:'亨。王假有庙，利涉大川，利贞。',xiang:'涣散疏通，风行水上，王假有庙利涉。'},
 {n:60,name:'节',U:6,D:2,tuan:'亨。苦节不可贞。',xiang:'节制有度，苦节不可，节而能通。'},
 {n:61,name:'中孚',U:5,D:2,tuan:'豚鱼吉，利涉大川，利贞。',xiang:'中心诚信，豚鱼吉，舟虚有信。'},
 {n:62,name:'小过',U:4,D:7,tuan:'亨，利贞。可小事，不可大事。飞鸟遗之音，不宜上，宜下，大吉。',xiang:'小者过越，飞鸟遗音，宜下不宜上。'},
 {n:63,name:'既济',U:6,D:3,tuan:'亨，小利贞，初吉终乱。',xiang:'事已成矣，初吉终乱，守成防变。'},
 {n:64,name:'未济',U:3,D:6,tuan:'亨，小狐汔济，濡其尾，无攸利。',xiang:'事未竟也，小狐汔济，慎终如始。'},
];

const YAO = {
  1:["初九：潜龙勿用。","九二：见龙在田，利见大人。","九三：君子终日乾乾，夕惕若，厉无咎。","九四：或跃在渊，无咎。","九五：飞龙在天，利见大人。","上九：亢龙有悔。"],
  2:["初六：履霜，坚冰至。","六二：直，方，大，不习无不利。","六三：含章可贞，或从王事，无成有终。","六四：括囊，无咎无誉。","六五：黄裳，元吉。","上六：龙战于野，其血玄黄。"],
  3:["初九：磐桓，利居贞，利建侯。","六二：屯如邅如，乘马班如，匪寇婚媾，女子贞不字，十年乃字。","六三：即鹿无虞，惟入于林中，君子几，不如舍，往吝。","六四：乘马班如，求婚媾，往吉，无不利。","九五：屯其膏，小贞吉，大贞凶。","上六：乘马班如，泣血涟如。"],
  4:["初六：发蒙，利用刑人，用说桎梏，以往吝。","九二：包蒙，吉；纳妇，吉；子克家。","六三：勿用取女，见金夫，不有躬，无攸利。","六四：困蒙，吝。","六五：童蒙，吉。","上九：击蒙，不利为寇，利御寇。"],
  5:["初九：需于郊，利用恒，无咎。","九二：需于沙，小有言，终吉。","九三：需于泥，致寇至。","六四：需于血，出自穴。","九五：需于酒食，贞吉。","上六：入于穴，有不速之客三人来，敬之终吉。"],
  6:["初六：不永所事，小有言，终吉。","九二：不克讼，归而逋，其邑人三百户，无眚。","六三：食旧德，贞厉，终吉；或从王事，无成。","九四：不克讼，复即命，渝，安贞吉。","九五：讼，元吉。","上九：或锡之鞶带，终朝三褫之。"],
  7:["初六：师出以律，否臧凶。","九二：在师中，吉，无咎，王三锡命。","六三：师或舆尸，凶。","六四：师左次，无咎。","六五：田有禽，利执言，无咎；长子帅师，弟子舆尸，贞凶。","上六：大君有命，开国承家，小人勿用。"],
  8:["初六：有孚比之，无咎；有孚盈缶，终来有它，吉。","六二：比之自内，贞吉。","六三：比之匪人。","六四：外比之，贞吉。","九五：显比，王用三驱，失前禽，邑人不诫，吉。","上六：比之无首，凶。"],
  9:["初九：复自道，何其咎？吉。","九二：牵复，吉。","九三：舆说辐，夫妻反目。","六四：有孚，血去惕出，无咎。","九五：有孚挛如，富以其邻。","上九：既雨既处，尚德载，妇贞厉；月几望，君子征凶。"],
  10:["初九：素履，往无咎。","九二：履道坦坦，幽人贞吉。","六三：眇能视，跛能履，履虎尾，咥人，凶；武人为于大君。","九四：履虎尾，愬愬，终吉。","九五：夬履，贞厉。","上九：视履考祥，其旋元吉。"],
  11:["初九：拔茅茹，以其汇，征吉。","九二：包荒，用冯河，不遐遗，朋亡，得尚于中行。","九三：无平不陂，无往不复，艰贞无咎；勿恤其孚，于食有福。","六四：翩翩，不富以其邻，不戒以孚。","六五：帝乙归妹，以祉元吉。","上六：城复于隍，勿用师，自邑告命，贞吝。"],
  12:["初六：拔茅茹，以其汇，贞吉，亨。","六二：包承，小人吉，大人否，亨。","六三：包羞。","九四：有命无咎，畴离祉。","九五：休否，大人吉；其亡其亡，系于苞桑。","上九：倾否，先否后喜。"],
  13:["初九：同人于门，无咎。","六二：同人于宗，吝。","九三：伏戎于莽，升其高陵，三岁不兴。","九四：乘其墉，弗克攻，吉。","九五：同人，先号咷而后笑，大师克相遇。","上九：同人于郊，无悔。"],
  14:["初九：无交害，匪咎，艰则无咎。","九二：大车以载，有攸往，无咎。","九三：公用亨于天子，小人弗克。","九四：匪其彭，无咎。","六五：厥孚交如，威如，吉。","上九：自天佑之，吉无不利。"],
  15:["初六：谦谦君子，用涉大川，吉。","六二：鸣谦，贞吉。","九三：劳谦，君子有终，吉。","六四：无不利，撝谦。","六五：不富以其邻，利用侵伐，无不利。","上六：鸣谦，利用行师，征邑国。"],
  16:["初六：鸣豫，凶。","六二：介于石，不终日，贞吉。","六三：盱豫，悔，迟有悔。","九四：由豫，大有得；勿疑，朋盍簪。","六五：贞疾，恒不死。","上六：冥豫，成有渝，无咎。"],
  17:["初九：官有渝，贞吉；出门交有功。","六二：系小子，失丈夫。","六三：系丈夫，失小子；随有求得，利居贞。","九四：随有获，贞凶；有孚在道，以明，何咎？","九五：孚于嘉，吉。","上六：拘系之，乃从维之，王用亨于西山。"],
  18:["初六：干父之蛊，有子，考无咎，厉终吉。","九二：干母之蛊，不可贞。","九三：干父之蛊，小有悔，无大咎。","六四：裕父之蛊，往见吝。","六五：干父之蛊，用誉。","上九：不事王侯，高尚其事。"],
  19:["初九：咸临，贞吉。","九二：咸临，吉，无不利。","六三：甘临，无攸利；既忧之，无咎。","六四：至临，无咎。","六五：知临，大君之宜，吉。","上六：敦临，吉，无咎。"],
  20:["初六：童观，小人无咎，君子吝。","六二：窥观，利女贞。","六三：观我生，进退。","六四：观国之光，利用宾于王。","九五：观我生，君子无咎。","上九：观其生，君子无咎。"],
  21:["初九：屦校灭趾，无咎。","六二：噬肤灭鼻，无咎。","六三：噬腊肉，遇毒，小吝，无咎。","九四：噬乾胏，得金矢，利艰贞，吉。","六五：噬乾肉，得黄金，贞厉，无咎。","上九：何校灭耳，凶。"],
  22:["初九：贲其趾，舍车而徒。","六二：贲其须。","九三：贲如濡如，永贞吉。","六四：贲如皤如，白马翰如，匪寇婚媾。","六五：贲于丘园，束帛戋戋，吝，终吉。","上九：白贲，无咎。"],
  23:["初六：剥床以足，蔑贞凶。","六二：剥床以辨，蔑贞凶。","六三：剥之，无咎。","六四：剥床以肤，凶。","六五：贯鱼，以宫人宠，无不利。","上九：硕果不食，君子得舆，小人剥庐。"],
  24:["初九：不远复，无祇悔，元吉。","六二：休复，吉。","六三：频复，厉，无咎。","六四：中行独复。","六五：敦复，无悔。","上六：迷复，凶，有灾眚；用行师，终有大败，以其国君凶，至于十年不克征。"],
  25:["初九：无妄，往吉。","六二：不耕获，不菑畲，则利有攸往。","六三：无妄之灾，或系之牛，行人之得，邑人之灾。","九四：可贞，无咎。","九五：无妄之疾，勿药有喜。","上九：无妄，行有眚，无攸利。"],
  26:["初九：有厉，利已。","九二：舆说輹。","九三：良马逐，利艰贞，曰闲舆卫，利有攸往。","六四：童牛之牿，元吉。","六五：豮豕之牙，吉。","上九：何天之衢，亨。"],
  27:["初九：舍尔灵龟，观我朵颐，凶。","六二：颠颐，拂经，于丘颐，征凶。","六三：拂颐，贞凶，十年勿用，无攸利。","六四：颠颐，吉；虎视眈眈，其欲逐逐，无咎。","六五：拂经，居贞吉，不可涉大川。","上九：由颐，厉吉，利涉大川。"],
  28:["初六：藉用白茅，无咎。","九二：枯杨生稊，老夫得其女妻，无不利。","九三：栋桡，凶。","九四：栋隆，吉；有它吝。","九五：枯杨生华，老妇得其士夫，无咎无誉。","上六：过涉灭顶，凶，无咎。"],
  29:["初六：习坎，入于坎窞，凶。","九二：坎有险，求小得。","六三：来之坎坎，险且枕，入于坎窞，勿用。","六四：樽酒簋贰，用缶，纳约自牖，终无咎。","九五：坎不盈，祗既平，无咎。","上六：系用徽纆，寘于丛棘，三岁不得，凶。"],
  30:["初九：履错然，敬之，无咎。","六二：黄离，元吉。","九三：日昃之离，不鼓缶而歌，则大耋之嗟，凶。","九四：突如其来如，焚如，死如，弃如。","六五：出涕沱若，戚嗟若，吉。","上九：王用出征，有嘉折首，获匪其丑，无咎。"],
  31:["初六：咸其拇。","六二：咸其腓，凶；居吉。","九三：咸其股，执其随，往吝。","九四：贞吉悔亡，憧憧往来，朋从尔思。","九五：咸其脢，无悔。","上六：咸其辅颊舌。"],
  32:["初六：浚恒，贞凶，无攸利。","九二：悔亡。","九三：不恒其德，或承之羞，贞吝。","九四：田无禽。","六五：恒其德，贞，妇人吉，夫子凶。","上六：振恒，凶。"],
  33:["初六：遁尾，厉，勿用有攸往。","六二：执之用黄牛之革，莫之胜说。","九三：系遁，有疾厉，畜臣妾吉。","九四：好遁，君子吉，小人否。","九五：嘉遁，贞吉。","上九：肥遁，无不利。"],
  34:["初九：壮于趾，征凶，有孚。","九二：贞吉。","九三：壮于頄，有凶；君子夬夬，独行遇雨，若濡有愠，无咎。","九四：贞吉悔亡，藩决不羸，壮于大舆之輹。","六五：丧羊于易，无悔。","上六：羝羊触藩，不能退，不能遂，无攸利，艰则吉。"],
  35:["初六：晋如摧如，贞吉；罔孚，裕无咎。","六二：晋如愁如，贞吉；受兹介福，于其王母。","六三：众允，悔亡。","九四：晋如鼫鼠，贞厉。","六五：悔亡，失得勿恤，往吉，无不利。","上九：晋其角，维用伐邑，厉吉无咎，贞吝。"],
  36:["初九：明夷于飞，垂其翼；君子于行，三日不食，有攸往，主人有言。","六二：明夷，夷于左股，用拯马壮，吉。","九三：明夷于南狩，得其大首，不可疾贞。","六四：入于左腹，获明夷之心，于出门庭。","六五：箕子之明夷，利贞。","上六：不明晦，初登于天，后入于地。"],
  37:["初九：闲有家，悔亡。","六二：无攸遂，在中馈，贞吉。","九三：家人嗃嗃，悔厉吉；妇子嘻嘻，终吝。","六四：富家，大吉。","九五：王假有家，勿恤，吉。","上九：有孚威如，终吉。"],
  38:["初九：悔亡；丧马勿逐，自复；见恶人，无咎。","九二：遇主于巷，无咎。","六三：见舆曳，其牛掣，其人天且劓，无初有终。","九四：睽孤，遇元夫，交孚，厉无咎。","六五：悔亡，厥宗噬肤，往何咎？","上九：睽孤，见豕负涂，载鬼一车，先张之弧，后说之弧，匪寇婚媾，往遇雨则吉。"],
  39:["初六：往蹇，来誉。","六二：王臣蹇蹇，匪躬之故。","九三：往蹇，来反。","六四：往蹇，来连。","九五：大蹇，朋来。","上六：往蹇，来硕，吉；利见大人。"],
  40:["初六：无咎。","九二：田获三狐，得黄矢，贞吉。","六三：负且乘，致寇至，贞吝。","九四：解而拇，朋至斯孚。","六五：君子维有解，吉；有孚于小人。","上六：公用射隼于高墉之上，获之，无不利。"],
  41:["初九：已事遄往，无咎，酌损之。","九二：利贞，征凶，弗损益之。","六三：三人行，则损一人；一人行，则得其友。","六四：损其疾，使遄有喜，无咎。","六五：或益之十朋之龟，弗克违，元吉。","上九：弗损益之，无咎，贞吉，利有攸往，得臣无家。"],
  42:["初九：利用为大作，元吉，无咎。","六二：或益之十朋之龟，弗克违，永贞吉；王用享于帝，吉。","六三：益之用凶事，无咎；有孚中行，告公用圭。","六四：中行，告公从，利用为依迁国。","九五：有孚惠心，勿问元吉；有孚惠我德。","上九：莫益之，或击之，立心勿恒，凶。"],
  43:["初九：壮于前趾，往不胜，为吝。","九二：惕号，莫夜有戎，勿恤。","九三：壮于頄，有凶；君子夬夬，独行遇雨，若濡有愠，无咎。","九四：臀无肤，其行次且；牵羊悔亡，闻言不信。","九五：苋陆夬夬，中行无咎。","上六：无号，终有凶。"],
  44:["初六：系于金柅，贞吉；有攸往，见凶；羸豕孚蹢躅。","九二：包有鱼，无咎，不利宾。","九三：臀无肤，其行次且，厉，无大咎。","九四：包无鱼，起凶。","九五：以杞包瓜，含章，有陨自天。","上九：姤其角，吝，无咎。"],
  45:["初六：有孚不终，乃乱乃萃；若号，一握为笑；勿恤，往无咎。","六二：引吉，无咎；孚乃利用禴。","六三：萃如嗟如，无攸利；往无咎，小吝。","九四：大吉，无咎。","九五：萃有位，无咎；匪孚，元永贞，悔亡。","上六：赍咨涕洟，无咎。"],
  46:["初六：允升，大吉。","九二：孚乃利用禴，无咎。","九三：升虚邑。","六四：王用亨于岐山，吉，无咎。","六五：贞吉，升阶。","上六：冥升，利于不息之贞。"],
  47:["初六：臀困于株木，入于幽谷，三岁不觌。","九二：困于酒食，朱绂方来，利用享祀；征凶，无咎。","六三：困于石，据于蒺藜，入于其宫，不见其妻，凶。","九四：来徐徐，困于金车，吝，有终。","九五：劓刖，困于赤绂，乃徐有说，利用祭祀。","上六：困于葛藟，于臲卼，曰动悔有悔，征吉。"],
  48:["初六：井泥不食，旧井无禽。","九二：井谷射鲋，瓮敝漏。","九三：井渫不食，为我心恻；可用汲，王明，并受其福。","六四：井甃，无咎。","九五：井冽，寒泉食。","上六：井收，勿幕；有孚，元吉。"],
  49:["初九：巩用黄牛之革。","六二：巳日乃革之，征吉，无咎。","九三：征凶，贞厉；革言三就，有孚。","九四：悔亡，有孚改命，吉。","九五：大人虎变，未占有孚。","上六：君子豹变，小人革面；征凶，居贞吉。"],
  50:["初六：鼎颠趾，利出否；得妾以其子，无咎。","九二：鼎有实，我仇有疾，不我能即，吉。","九三：鼎耳革，其行塞，雉膏不食；方雨亏悔，终吉。","九四：鼎折足，覆公餗，其形渥，凶。","六五：鼎黄耳金铉，利贞。","上九：鼎玉铉，大吉，无不利。"],
  51:["初九：震来虩虩，后笑言哑哑，吉。","六二：震来厉，亿丧贝，跻于九陵；勿逐，七日得。","六三：震苏苏，震行无眚。","九四：震遂泥。","六五：震往来厉，亿无丧，有事。","上六：震索索，视矍矍，征凶；震不于其躬，于其邻，无咎；婚媾有言。"],
  52:["初六：艮其趾，无咎，利永贞。","六二：艮其腓，不拯其随，其心不快。","九三：艮其限，列其夤，厉薰心。","六四：艮其身，无咎。","六五：艮其辅，言有序，悔亡。","上九：敦艮，吉。"],
  53:["初六：鸿渐于干，小子厉，有言，无咎。","六二：鸿渐于磐，饮食衎衎，吉。","九三：鸿渐于陆，夫征不复，妇孕不育，凶；利御寇。","六四：鸿渐于木，或得其桷，无咎。","九五：鸿渐于陵，妇三岁不孕，终莫之胜，吉。","上九：鸿渐于陆，其羽可用为仪，吉。"],
  54:["初九：归妹以娣，跛能履，征吉。","九二：眇能视，利幽人之贞。","六三：归妹以须，反归以娣。","九四：归妹愆期，迟归有时。","六五：帝乙归妹，其君之袂，不如其娣之袂良；月几望，吉。","上六：女承筐无实，士刲羊无血，无攸利。"],
  55:["初九：遇其配主，虽旬无咎，往有尚。","六二：丰其蔀，日中见斗，往得疑疾；有孚发若，吉。","九三：丰其沛，日中见沫，折其右肱，无咎。","九四：丰其蔀，日中见斗，遇其夷主，吉。","六五：来章，有庆誉，吉。","上六：丰其屋，蔀其家，窥其户，阒其无人，三岁不觌，凶。"],
  56:["初六：旅琐琐，斯其所取灾。","六二：旅即次，怀其资，得童仆贞。","九三：旅焚其次，丧其童仆，贞厉。","九四：旅于处，得其资斧，我心不快。","六五：射雉，一矢亡，终以誉命。","上九：鸟焚其巢，旅人先笑后号咷；丧牛于易，凶。"],
  57:["初六：进退，利武人之贞。","九二：巽在床下，用史巫纷若，吉，无咎。","九三：频巽，吝。","六四：悔亡，田获三品。","九五：贞吉悔亡，无不利；无初有终，先庚三日，后庚三日，吉。","上九：巽在床下，丧其资斧，贞凶。"],
  58:["初九：和兑，吉。","九二：孚兑，吉，悔亡。","六三：来兑，凶。","九四：商兑未宁，介疾有喜。","九五：孚于剥，有厉。","上六：引兑。"],
  59:["初六：用拯马壮，吉。","九二：涣奔其机，悔亡。","六三：涣其躬，无悔。","六四：涣其群，元吉；涣有丘，匪夷所思。","九五：涣汗其大号，涣王居，无咎。","上九：涣其血去，逖出，无咎。"],
  60:["初九：不出户庭，无咎。","九二：不出门庭，凶。","六三：不节若，则嗟若，无咎。","六四：安节，亨。","九五：甘节，吉，往有尚。","上六：苦节，贞凶，悔亡。"],
  61:["初九：虞吉，有它不燕。","九二：鸣鹤在阴，其子和之；我有好爵，吾与尔靡之。","六三：得敌，或鼓或罢，或泣或歌。","六四：月几望，马匹亡，无咎。","九五：有孚挛如，无咎。","上九：翰音登于天，贞凶。"],
  62:["初六：飞鸟以凶。","六二：过其祖，遇其妣；不及其君，遇其臣，无咎。","九三：弗过防之，从或戕之，凶。","九四：无咎，弗过遇之；往厉必戒，勿用永贞。","六五：密云不雨，自我西郊；公弋取彼在穴。","上六：弗遇过之，飞鸟离之，凶，是谓灾眚。"],
  63:["初九：曳其轮，濡其尾，无咎。","六二：妇丧其茀，勿逐，七日得。","九三：高宗伐鬼方，三年克之，小人勿用。","六四：繻有衣袽，终日戒。","九五：东邻杀牛，不如西邻之禴祭，实受其福。","上六：濡其首，厉。"],
  64:["初六：濡其尾，吝。","九二：曳其轮，贞吉。","六三：未济，征凶，利涉大川。","九四：贞吉悔亡，震用伐鬼方，三年有赏于大国。","六五：贞吉无悔，君子之光，有孚，吉。","上九：有孚于饮酒，无咎；濡其首，有孚失是。"],
};

function trigramFromBinary(bin){
  const key = bin.join('');
  for(const k in TRIGRAMS){ if(TRIGRAMS[k].binary.join('')===key) return +k; }
  return null;
}
function trgIdx(n){ return ((n%8)+8)%8 || 8; }
function lineIdx(n){ return ((n%6)+6)%6 || 6; }

// 由上下卦取 6 爻（底->顶）；TRIGRAMS.binary 为 [初,二,三]（下->上）
function linesFromUD(U,D){
  const ub=TRIGRAMS[U].binary, db=TRIGRAMS[D].binary;
  return [ db[0], db[1], db[2], ub[0], ub[1], ub[2] ]; // 初,二,三,四,五,上
}
function findHex(U,D){ return HEX.find(h=>h.U===U && h.D===D); }

// 五行生克
const SHENG={木:'火',火:'土',土:'金',金:'水',水:'木'};
const KE={木:'土',土:'水',水:'火',火:'金',金:'木'};
function sheng(a,b){ return SHENG[a]===b; }
function ke(a,b){ return KE[a]===b; }

// 体用判定
function tiYong(hex, dong){
  const idx=dong-1;
  const ti = idx<3 ? hex.D : hex.U;   // 动在下卦则下为用、上为体
  const yong = idx<3 ? hex.U : hex.D;
  const tw=TRIGRAMS[ti].wu, yw=TRIGRAMS[yong].wu;
  let level, txt;
  if(tw===yw){ level='平'; txt='体用比和，事多顺遂，少有掣肘。'; }
  else if(sheng(yw,tw)){ level='大吉'; txt='用生体——外来助你，顺势而得，宜把握。'; }
  else if(sheng(tw,yw)){ level='小耗'; txt='体生用——你往外输出能量，事可成但须耗神费力。'; }
  else if(ke(tw,yw)){ level='吉'; txt='体克用——你能驾驭局面，费力而终成。'; }
  else { level='凶'; txt='用克体——外力压迫于你，宜守不宜攻，慎防损耗。'; }
  return {ti,yong,tw,yw,level,txt};
}

// 卦气旺衰（体卦是否得令，按公历季节近似）
function seasonStrength(wu, month){
  let cur;
  if(month>=3&&month<=5) cur='木';
  else if(month>=6&&month<=8) cur='火';
  else if(month>=9&&month<=11) cur='金';
  else cur='水';
  if(wu==='土') return '土旺四季，体卦得地，根基稳。';
  return wu===cur ? '体卦当令得时，气势方盛。' : '体卦失令，宜借势蓄力，不宜强出头。';
}

/* ============ 起卦 ============ */
function castTime(date){
  const y=date.getFullYear(), m=date.getMonth()+1, d=date.getDate(), h=date.getHours();
  const yearZhi=((y-4)%12+12)%12;            // 0=子
  const yearNum=yearZhi+1;                    // 1..12
  const monthNum=m;                           // 1..12
  const dayNum=d;                             // 1..31
  let branch=Math.floor((h+1)/2); if(branch===0) branch=12;
  const hourNum=branch;                       // 1..12
  const up=trgIdx(yearNum+monthNum+dayNum);
  const down=trgIdx(yearNum+monthNum+dayNum+hourNum);
  const dong=lineIdx(yearNum+monthNum+dayNum+hourNum);
  return {
    method:'time',
    params:{yearZhi:BRANCH[yearZhi], monthNum, dayNum, hourZhi:BRANCH[branch-1]},
    up, down, dong
  };
}
function castNum(a,b){
  const up=trgIdx(a), down=trgIdx(b), dong=lineIdx(a+b);
  return { method:'num', params:{a,b}, up, down, dong };
}

/* ============ 五行旺相休囚死（按月令） ============ */
const SEASON_WU = {2:'木',3:'木',4:'火',5:'火',6:'火',7:'土',8:'金',9:'金',10:'金',11:'水',12:'水',1:'水'};
function wangState(wu, month){
  const sw=SEASON_WU[month]||'水';
  if(wu===sw) return {key:'旺', label:'当令而旺', desc:'得月令之气，力量最强，主事态有力、可主动作为。'};
  if(SHENG[sw]===wu) return {key:'相', label:'得生而相', desc:'月令生扶，力量次强，主有外力相助、顺势可成。'};
  if(SHENG[wu]===sw) return {key:'休', label:'泄气而休', desc:'生助月令而自泄，力量转弱，主付出多、宜蓄养。'};
  if(KE[sw]===wu) return {key:'囚', label:'受克而囚', desc:'被月令所克，力量受制，主受压、宜守不宜攻。'};
  return {key:'死', label:'制令而衰', desc:'克制月令而耗力，力量最弱，主事倍功半、宜待时。'};
}

/* ============ 应期推断（梅花易数成法：旺相速、休囚迟） ============ */
function yingqi(ty, dong, month){
  let basis, n;
  if(ty.level==='平'){ basis='体用比和，事顺而缓，取动爻数'; n=dong; }
  else if(ty.level==='大吉'||ty.level==='吉'){ basis='吉卦取用卦数以应'; n=ty.yong; }
  else { basis='凶／耗卦取体卦数以应'; n=ty.ti; }
  const tw=wangState(ty.tw,month).key;
  let speed, unit;
  if(tw==='旺'){ speed='体卦当令，应期偏快'; unit='日'; }
  else if(tw==='相'){ speed='体卦得生，应期较快'; unit='周'; }
  else if(tw==='休'){ speed='体卦气泄，应期稍缓'; unit='月'; }
  else { speed='体卦受制，应期偏迟'; unit='月'; }
  return { text:basis+' → 约 '+n+' '+unit+'内见分晓；'+speed+'。', n, unit };
}

/* ============ 应期精算：卦数 × 旺衰倍率，收敛到具体天数 ============ */
function yingqiPrecise(ty, dong, month){
  let base, src;
  if(ty.level==='平'){ base=dong; src='动爻数 '+dong; }
  else if(ty.level==='大吉'||ty.level==='吉'){ base=ty.yong; src='用卦数 '+ty.yong; }
  else { base=ty.ti; src='体卦数 '+ty.ti; }
  const key=wangState(ty.tw,month).key;
  const factor={旺:1,相:1,休:3,囚:6,死:9}[key]||1;
  const slow=Math.max(1,Math.round(base*factor));
  const fast=base;
  let text;
  if(key==='旺'||key==='相') text='卦气'+key+'，应期偏快：约 '+fast+' 天内见分晓';
  else text='卦气'+key+'，应期偏迟：约 '+slow+' 天左右（最快 '+fast+' 天已见苗头）';
  return { src, key, fast, slow, text:text+'（取'+src+'）' };
}

/* ============ 方位／颜色／数字落地线索 ============ */
function landingClues(ty){
  const yongDir=TRI_DIR[ty.yong]||'—', tiDir=TRI_DIR[ty.ti]||'—';
  const wi=WU_INFO[ty.yw]||WU_INFO['水'];
  const good=(ty.level==='大吉'||ty.level==='吉');
  const bad=(ty.level==='凶'||ty.level==='小耗');
  const dirLine='这事多从「'+yongDir+'」方来；你安稳之位在「'+tiDir+'」'
    +(good?'，宜向'+yongDir+'方主动推进':bad?'，宜避'+yongDir+'方的直接冲撞':'，两方皆可从容往来');
  const objLine='用卦属'+ty.yw+'：应事之色多为「'+wi.color+'」，应数为「'+wi.num+'」，应时多在'+wi.time;
  return { dirLine, objLine, yongDir, tiDir, wi };
}

/* ============ 爻际精断：当位 / 比应 / 承乘 / 动爻助孤 ============ */
function yaoRelations(L, dong){
  const i=dong-1;
  const yangPos=[1,0,1,0,1,0];              // 初、三、五为阳位
  const dang=(L[i]===yangPos[i]);
  const yingIdx=i<3?i+3:i-3;                 // 初应四、二应五、三应上
  const ying=(L[i]!==L[yingIdx]);             // 一阴一阳为有应
  const posName=['初','二','三','四','五','上'][i];
  let neigh=[];
  if(i>0){
    const below=L[i-1];
    if(L[i]===0 && below===1) neigh.push('下承阳（阴承阳为顺，得助）');
    else if(L[i]===1 && below===0) neigh.push('下有阴承你（得助）');
    else neigh.push('与下爻同性，少承助之力');
  }
  if(i<5){
    const above=L[i+1];
    if(L[i]===0 && above===1) neigh.push('上乘阳（阴乘阳为逆，受压）');
    else if(L[i]===1 && above===0) neigh.push('上有阴乘你（耗神）');
    else neigh.push('与上爻同性，无相制相成');
  }
  let verdict;
  if(dang&&ying) verdict='动爻'+posName+'当位又有应——动而有据，力量不弱，可放心作为。';
  else if(!dang&&!ying) verdict='动爻'+posName+'失位又无应——孤立少援，动则费力，宜借势不宜强为。';
  else if(dang) verdict='动爻'+posName+'当位但无应——自身站稳，外援不足，宜稳扎稳打。';
  else verdict='动爻'+posName+'有应但失位——有人呼应，位置未稳，宜先正其位再动。';
  return { dang, ying, posName, text:verdict+' '+neigh.join('；')+'。' };
}

/* ============ 卦象结构：错卦（反面隐患）/ 综卦（换位视角） ============ */
function structGua(L){
  const cuoL=L.map(x=>1-x);                  // 六爻全反 = 错卦
  const cuo=findHex(
    trigramFromBinary([cuoL[3],cuoL[4],cuoL[5]]),
    trigramFromBinary([cuoL[0],cuoL[1],cuoL[2]])
  );
  const zongL=L.slice().reverse();           // 六爻颠转 = 综卦
  const zong=findHex(
    trigramFromBinary([zongL[3],zongL[4],zongL[5]]),
    trigramFromBinary([zongL[0],zongL[1],zongL[2]])
  );
  return { cuo, zong };
}

    const qEl=$('#qtext');
    Store.add(newRecord({
      q: qEl && qEl.value ? qEl.value.trim() : '',
      kind:'hex', cat:STATE.cat,
      gua: ben.name+'·'+dongName+'爻动·'+ch.name,
      level:ty.level, digest:ty.txt, method:r.method
    }));
  }

  $('#result').innerHTML=html;
}
/* ============ 灵签渲染 ============ */
function drawSign(){
  const i=Math.floor(Math.random()*SIGNS.length);
  return {index:i, sign:SIGNS[i]};
}
function renderDraw(r){
  const sg=r.sign;
  const gradeText={上上:'上上签',上:'上签',中上:'中上签',中:'中签',中下:'中下签',下下:'下下签'}[sg.grade];
  const catLabelMap={感情:'感情',事业:'事业',财运:'财运',决策:'决策 / 选择'};

  let html='';
  html+='<div class="sign-hero">'
      +'<div class="grade">'+gradeText+'</div>'
      +'<div class="no">第 '+(r.index+1)+' 签 · 共 '+SIGNS.length+' 签</div>'
      +'<div class="title">'+sg.title+'</div></div>';

  html+='<div class="sign-poem">'+sg.poem.replace(/\n/g,'<br/>')+'</div>';

  html+='<div class="block" style="margin-top:22px;"><h3><span class="num">签解</span>就你所问的「'+(catLabelMap[STATE.cat]||'此事')+'」</h3>'
      +'<div class="body">'+sg.read[STATE.cat]+'</div></div>';

  html+='<div class="read-grid">';
  [['感情','感情'],['事业','事业'],['财运','财运'],['决策','决策 / 选择']].forEach(([k,label])=>{
    html+='<div class="read-item'+(k===STATE.cat?' sel':'')+'" style="'+(k===STATE.cat?'border-color:var(--accent-border);background:var(--accent-soft);':'')+'">'
        +'<div class="k">'+label+'</div><div class="v">'+sg.read[k]+'</div></div>';
  });
  html+='</div>';

  html+='<div class="block" style="border-color:var(--accent-border);background:var(--accent-soft)"><h3><span class="num">心镜回照</span>落到一处</h3>'
      +'<div class="body">'+sg.action+'</div></div>';

  html+='<div class="center"><span class="params">灵签 · 默念所问后随机求得 · 仅供启迪</span></div>';

  if(Store.ok()){
    const qEl=$('#qtext');
    Store.add(newRecord({
      q: qEl && qEl.value ? qEl.value.trim() : '',
      kind:'draw', cat:STATE.cat,
      gua: gradeText+' · '+sg.title+'（第'+(r.index+1)+'签）',
      level:sg.grade, digest:sg.action, method:'draw'
    }));
  }

  $('#result').innerHTML=html;
}

/* ============ 验证闭环：卦簿界面 ============ */
function fmtDate(ts){
  const d=new Date(ts);
  const p=n=>String(n).padStart(2,'0');
  return (d.getMonth()+1)+'月'+d.getDate()+'日 '+p(d.getHours())+':'+p(d.getMinutes());
}
function renderBook(){
  if(!Store.ok()){
    $('#bookList').innerHTML='<div class="empty">当前浏览器不支持本地存储，卦簿不可用。<br/>（通常是隐私模式导致）</div>';
    return;
  }
  const recs=Store.all(), st=Store.stats();
  let html='';
  html+='<div class="book-bar"><div class="book-stat">共 <b>'+st.total+'</b> 次起卦 · 已复盘 <b>'+st.done+'</b> · 应验 <b>'+st.hit+'</b>'
      +(st.rate!==null?' · 应验率 <b>'+st.rate+'%</b>':'')+'</div>'
      +(st.total?'<button class="mini-btn" id="bookClear">清空卦簿</button>':'')+'</div>';

  if(!recs.length){
    html+='<div class="empty">卦簿还是空的。<br/>起一卦后会自动留档，日后再回来标记应验与否。</div>';
    $('#bookList').innerHTML=html;
    return;
  }

  recs.forEach(rec=>{
    const q=rec.q||'（未写下问题）';
    const catLabel={感情:'感情',事业:'事业',财运:'财运',决策:'决策'}[rec.cat]||rec.cat||'—';
    const statusPill=rec.status==='hit'?'<span class="tag-pill on">已应验</span>':rec.status==='miss'?'<span class="tag-pill">未应验</span>':'<span class="tag-pill">待复盘</span>';
    html+='<div class="rec" data-id="'+rec.id+'">'
        +'<div class="rec-head"><div class="rec-q">'+escapeHTML(q)+'</div><div class="rec-meta">'+fmtDate(rec.ts)+'</div></div>'
        +'<div class="rec-gua"><span class="tag-pill">'+catLabel+'</span>'+statusPill+escapeHTML(rec.gua||'')+'</div>'
        +'<div class="rec-gua">'+escapeHTML(rec.digest||'')+'</div>'
        +'<div class="rec-act">'
        +'<button class="mini-btn '+(rec.status==='hit'?'hit':'')+'" data-act="hit">应验</button>'
        +'<button class="mini-btn '+(rec.status==='miss'?'miss':'')+'" data-act="miss">未验</button>'
        +'<button class="mini-btn" data-act="pending">撤销</button>'
        +'<button class="mini-btn" data-act="del">删除</button>'
        +'</div>'
        +(rec.note?'<div class="rec-gua" style="margin-top:8px;">复盘：'+escapeHTML(rec.note)+'</div>':'')
        +'<textarea class="rec-note" rows="2" placeholder="日后回看：当时断得准吗？记下一句复盘…" data-role="note">'+escapeHTML(rec.note||'')+'</textarea>'
        +'</div>';
  });
  $('#bookList').innerHTML=html;
}
function escapeHTML(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// 卦簿交互（事件委托）
$('#bookList').addEventListener('click',e=>{
  const btn=e.target.closest('.mini-btn'); if(!btn) return;
  if(btn.id==='bookClear'){
    if(window.confirm && confirm('确定清空整本卦簿？此操作不可撤销。')){ Store.clear(); renderBook(); }
    return;
  }
  const rec=btn.closest('.rec'); if(!rec) return;
  const id=rec.dataset.id, act=btn.dataset.act;
  if(act==='del'){ Store.del(id); renderBook(); return; }
  if(act==='hit'||act==='miss'||act==='pending'){
    const patch={status:act, reviewTs:Date.now()};
    const noteEl=rec.querySelector('[data-role=note]');
    if(noteEl) patch.note=noteEl.value;
    Store.set(id,patch); renderBook(); return;
  }
});
$('#bookList').addEventListener('change',e=>{
  if(e.target.dataset && e.target.dataset.role==='note'){
    const rec=e.target.closest('.rec');
    if(rec) Store.set(rec.dataset.id,{note:e.target.value});
  }
});

</script>
</body>
</html>
